version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zinko-backend
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend:/app/backend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - zinko-network

  frontend:
    build:
      context: .
      dockerfile: next-frontend/Dockerfile
    container_name: zinko-next-frontend
    ports:
      - "3000:3000"
    env_file:
      - next-frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./next-frontend:/app/next-frontend
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/next-frontend/node_modules
    networks:
      - zinko-network

networks:
  zinko-network:
    driver: bridge